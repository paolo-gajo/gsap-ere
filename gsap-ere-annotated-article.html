      spanBoxes.set(mention.start + ":" + mention.end, boxes);
      boxes.forEach(function (box) {
        const rect = svgElement("rect", {
          x: box.x1 - 2,
          y: box.y - 16,
          width: box.x2 - box.x1 + 4,
          height: 20,
          rx: 2,
          class: "entity-box " + entityClass(mention.types),
          "data-tooltip": mention.types.join(" + ") + ": " +
            mentionText(item, mention.start, mention.end)
        });
        const rectTitle = svgElement("title");
        rectTitle.textContent = mention.types.join(" + ") + ": " +
          mentionText(item, mention.start, mention.end);
        rect.appendChild(rectTitle);
        highlightLayer.appendChild(rect);
      });
    });

    item.t.forEach(function (token, index) {
      const position = tokenPositions[index];
      const types = typesAt(item, index);
      const text = svgElement("text", {
        x: position.x,
        y: position.y,
        class: "body-token" + (types.length ? " entity-token" : "")
      });
      text.textContent = token;
      textLayer.appendChild(text);
    });

    function anchor(start, end, towardLine) {
      const boxes = spanBoxes.get(start + ":" + end);
      let box = boxes[0];
      if (boxes.length > 1 && towardLine !== undefined) {
        box = boxes.reduce(function (best, candidate) {
          return Math.abs(candidate.line - towardLine) <
            Math.abs(best.line - towardLine) ? candidate : best;
        }, boxes[0]);
      }
      return {
        x: (box.x1 + box.x2) / 2,
        y: box.y - 15,
        line: box.line
      };
    }

    item.r.forEach(function (relation, relationIndex) {
      const sourceFirst = spanBoxes.get(relation[0] + ":" + relation[1])[0];
      const targetFirst = spanBoxes.get(relation[2] + ":" + relation[3])[0];
      const source = anchor(relation[0], relation[1], targetFirst.line);
      const target = anchor(relation[2], relation[3], sourceFirst.line);
      const lane = relationIndex % 7;
      let d;
      let labelX;
      let labelY;

      if (Math.abs(source.x - target.x) < 4 && source.line === target.line) {
        const loopHeight = 28 + lane * 7;
        const loopWidth = 18 + lane * 4;
        d = "M " + (source.x - 2) + " " + source.y +
          " C " + (source.x - loopWidth) + " " + (source.y - loopHeight) +
          ", " + (source.x + loopWidth) + " " + (target.y - loopHeight) +
          ", " + (target.x + 2) + " " + target.y;
        labelX = source.x;
        labelY = source.y - loopHeight - 2;
      } else if (source.line === target.line) {
        const lift = 25 + lane * 8;
        const middle = (source.x + target.x) / 2;
        d = "M " + source.x + " " + source.y +
          " C " + source.x + " " + (source.y - lift) +
          ", " + target.x + " " + (target.y - lift) +
          ", " + target.x + " " + target.y;
        labelX = middle;
        labelY = source.y - lift + 2;
      } else {
        const bend = 24 + lane * 5;
        d = "M " + source.x + " " + source.y +
          " C " + source.x + " " + (source.y - bend) +
          ", " + target.x + " " + (target.y - bend) +
          ", " + target.x + " " + target.y;
        labelX = (source.x + target.x) / 2;
        labelY = (source.y + target.y) / 2 - bend / 2;
      }

      const path = svgElement("path", {
        d: d,
        class: "relation-path",
        "marker-end": "url(#" + markerId + ")"
      });
      const pathTitle = svgElement("title");
      pathTitle.textContent = relation[4] + ": " +
        mentionText(item, relation[0], relation[1]) + " → " +
        mentionText(item, relation[2], relation[3]);
      path.appendChild(pathTitle);
      relationLayer.appendChild(path);

      context.font = "400 12px " + fontFamily;
      const labelWidth = context.measureText(relation[4]).width + 8;
      relationLayer.appendChild(svgElement("rect", {
        x: labelX - labelWidth / 2,
        y: labelY - 11,
        width: labelWidth,
        height: 15,
        rx: 2,
        class: "relation-label-bg"
      }));
      const label = svgElement("text", {
        x: labelX,
        y: labelY,
        "text-anchor": "middle",
        class: "relation-label"
      });
      label.textContent = relation[4];
      relationLayer.appendChild(label);
    });
  }

  function drawAll() {
    root.querySelectorAll(".sentence").forEach(drawSentence);
  }

  drawAll();
  const resizeObserver = new ResizeObserver(drawAll);
  resizeObserver.observe(root);
})();
</script>
